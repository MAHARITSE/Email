    <script>
      // Polyfill : Promise.withResolvers (requis par pdf.js, absent des navigateurs < 2023)
      if (typeof Promise.withResolvers !== 'function') {
        Promise.withResolvers = function () {
          var resolve, reject;
          var promise = new Promise(function (res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Compatibility shim for environments where window.fetch has only a getter
      // Prevents "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var currentFetch = originalFetch;
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!desc || !desc.set) {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e) {
          // Gracefully fallback if property is non-configurable
        }
      })();
    </script>
